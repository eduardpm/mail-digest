[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-digest"
version = "0.1.0"
description = "Private daily Proton Mail summaries with a local Ollama model"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mail-digest = "maildigest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
